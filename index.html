<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청운교회 매일 기도</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0DB8DB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매일 기도">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF9FC;--card:#fff;--ink:#10222B;--sub:#5A7480;--brand:#0DB8DB;--line:#CFE6EE;--purple:#5B1DEB;--red:#F2382B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A181E;--card:#12262E;--ink:#E8F6FA;--sub:#8FB0BC;--line:#21404B}}
:root[data-theme="dark"]{--bg:#0A181E;--card:#12262E;--ink:#E8F6FA;--sub:#8FB0BC;--line:#21404B}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 'Gowun Dodum','Noto Sans KR',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 18px 48px}
h1,h2,.hf{font-family:'Gowun Batang',serif;font-weight:700;line-height:1.3}
h1{font-size:32px;margin:0}
h2{font-size:22px;margin:0 0 10px}
.logo{display:flex;align-items:center;gap:14px}
.ico{width:58px;height:58px;border-radius:14px;background:var(--brand);display:grid;place-items:center;font-size:32px}
.sub{color:var(--sub);font-size:14px}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;margin-top:10px;font-size:20px;color:#fff;font-family:'Gowun Batang',serif;font-weight:700}
.b1{background:var(--purple)}.b2{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:18px}
.banner{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--brand);color:#06232B;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.w{font-size:12px;color:var(--sub);font-weight:500}
.d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:14px}
.d.a{box-shadow:inset 0 0 0 2px var(--brand)}
.d.p{background:var(--brand);color:#06232B;font-weight:700}
.d.t{text-decoration:underline;text-underline-offset:3px}
.leg{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--sub)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bd{display:flex;gap:8px}
.bd div{flex:1;text-align:center;padding:10px 2px;border-radius:12px;background:var(--bg);opacity:.45;font-size:13px}
.bd div b{display:block;font-size:24px;line-height:1.3}
.bd .on{opacity:1;outline:2px solid var(--brand)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{border-color:var(--purple);background:var(--purple);color:#fff}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:12px;font:inherit;line-height:1.7;resize:vertical}
.pri{border:0;border-radius:12px;background:var(--purple);color:#fff;padding:12px 20px;font-weight:700;margin-top:10px}
.red{background:var(--red)}
.ghost{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px 18px;margin-top:10px}
.err{color:var(--red);font-size:14px;margin:6px 0 0}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.item p{margin:4px 0;white-space:pre-wrap}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;background:var(--bg);color:var(--sub)}
.del{border:2px solid var(--line);background:transparent;color:var(--red);border-radius:10px;padding:6px 12px;font-size:14px;margin-top:6px}
.del.ask{background:var(--red);border-color:var(--red);color:#fff}
.verse{font-family:'Gowun Batang',serif;font-size:22px;line-height:1.8;white-space:pre-wrap;padding:20px 4px 8px;word-break:keep-all}
.row{display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--sub);text-align:center;padding:24px 0}

.card.calbg{background-image:linear-gradient(color-mix(in srgb,var(--card) 80%,transparent),color-mix(in srgb,var(--card) 80%,transparent)),var(--calimg);background-size:cover;background-position:center 42%}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cb{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;line-height:1;padding:0}
.cb:disabled{opacity:.3;cursor:default}
.calbg{touch-action:pan-y}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:16px}
.opt:disabled{cursor:default;opacity:.75}
.opt.ok{border-color:#1faa59;background:#1faa59;color:#fff;opacity:1}
.opt.no{border-color:var(--red);background:var(--red);color:#fff;opacity:1}
.b4{background:#1faa59}
.pri.sm{padding:6px 14px;font-size:14px;border-radius:10px}
.edb{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 12px;font-size:14px;margin-top:6px;margin-right:6px}
.editing{margin:8px 0 6px;padding:8px 12px;border-radius:10px;background:var(--brand);color:#06232B;font-weight:700;font-size:14px}
.logo .back{margin-left:auto;font-size:14px;white-space:nowrap}
.swg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swb{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;font-size:13px}
.swb.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.sw{display:block;width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--line)}
.th{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
body.hasbg::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--bgimg) center top/var(--bgfit,contain) no-repeat;opacity:var(--bgop,.25);pointer-events:none}
body.hasbg .card:not(.calbg){background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent)}

/* ---- 깔끔한 앱 스타일 (왓챠피디아 느낌) ---- */
body{font:16px/1.6 'Noto Sans KR',system-ui,-apple-system,sans-serif}
main{padding:24px 20px 64px}
h1,h2,.hf{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px;line-height:1.2}
h2{font-size:18px;margin:0}
.card{border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.sec .card{margin-top:0}
.sec{margin-top:36px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.more,.tlink{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 0}
.bar,.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-24px -20px 0;padding:14px 20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{justify-content:flex-start;margin-bottom:0}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.cname{font-size:12px;font-weight:700;letter-spacing:.02em}
.stat{margin:18px 0 0}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.hb{height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font-size:14.5px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.hb.line{background:var(--card);color:var(--ink)}
.hb.fill{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.pmini{flex:0 0 78%;max-width:260px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:176px;padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.ptxt{flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.pcard p{margin:12px 0 10px;white-space:pre-wrap;line-height:1.75;word-break:keep-all}
.pcard .sub{line-height:1.7}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.li{font-size:26px}
.lt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.lt small{color:var(--sub);font-size:13px}
.pts{color:var(--sub);font-size:14px;font-weight:600}
.cnav h2{font-size:17px}
.chip{border-width:1px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pri{background:var(--ink);color:var(--bg);border-radius:12px}
.pri.red{background:var(--red);color:#fff}
.ghost{border-width:1px;border-radius:12px}
textarea{border-width:1px;border-radius:16px;padding:16px;min-height:160px}
.tag{padding:2px 10px}
.bd div{padding:14px 2px}
body.hasbg .pcard,body.hasbg .pmini,body.hasbg .lrow{background:color-mix(in srgb,var(--card) 88%,transparent)}
</style>
</head>

const THEMES={
  pink:{'--bg':'#FFF1F4','--card':'#FFFFFF','--ink':'#3A1F29','--sub':'#8C5C6B','--line':'#F4D5DD','--brand':'#F7A1B5'},
  mint:{'--bg':'#EDF9F2','--card':'#FFFFFF','--ink':'#12301F','--sub':'#4F7A62','--line':'#CDE9D8','--brand':'#6FD3A0'},
  lavender:{'--bg':'#F3F0FF','--card':'#FFFFFF','--ink':'#231A3D','--sub':'#6E6593','--line':'#DDD6F6','--brand':'#B7A6FF'},
  cream:{'--bg':'#FBF5E9','--card':'#FFFFFF','--ink':'#33281A','--sub':'#85704F','--line':'#EADFC6','--brand':'#F2C14E'},
  night:{'--bg':'#0F1724','--card':'#182236','--ink':'#EAF0FF','--sub':'#93A4C6','--line':'#2A3A58','--brand':'#4DA3FF'},
  black:{'--bg':'#000000','--card':'#121212','--ink':'#F2F2F2','--sub':'#9A9A9A','--line':'#2A2A2A','--brand':'#0DB8DB'}
};
const THEME_NAMES={default:'기본',pink:'분홍',mint:'민트',lavender:'연보라',cream:'크림',night:'밤하늘',black:'검정'};
const SW={default:'linear-gradient(135deg,#EEF9FC,#0DB8DB)',pink:'#F7A1B5',mint:'#6FD3A0',lavender:'#B7A6FF',cream:'#F2C14E',night:'#182236',black:'#000'};
const BGVARS=['--bg','--card','--ink','--sub','--line','--brand'];
let bgMsg='';
function bgSrc(k){return k==='photo1'?IMG1:k==='photo2'?CAL:k==='custom'?(S.bgImg||''):''}
function applyBg(){
  const r=document.documentElement.style,b=document.body,k=S.bg||'default',th=THEMES[k];
  BGVARS.forEach(v=>r.removeProperty(v));
  if(th)for(const v in th)r.setProperty(v,th[v]);
  const src=bgSrc(k);
  if(src){
    b.classList.add('hasbg');
    b.style.setProperty('--bgimg','url('+src+')');
    b.style.setProperty('--bgop',String(S.bgOp==null?.25:S.bgOp));
    b.style.setProperty('--bgfit',S.bgFit==='cover'?'cover':'contain');
  }else b.classList.remove('hasbg');
}
function bgView(){
  const k=S.bg||'default',photo=!!bgSrc(k);
  const col=Object.keys(THEME_NAMES).map(id=>'<button class="swb'+(k===id?' on':'')+'" data-a="bgset" data-v="'+id+'" aria-pressed="'+(k===id)+'"><span class="sw" style="background:'+SW[id]+'"></span>'+THEME_NAMES[id]+'</button>').join('');
  const ph=[['photo1',IMG1,'청운교회 1'],['photo2',CAL,'청운교회 2']].map(x=>'<button class="swb'+(k===x[0]?' on':'')+'" data-a="bgset" data-v="'+x[0]+'" aria-pressed="'+(k===x[0])+'"><img class="th" alt="" src="'+x[1]+'">'+x[2]+'</button>').join('')
    +(S.bgImg?'<button class="swb'+(k==='custom'?' on':'')+'" data-a="bgset" data-v="custom" aria-pressed="'+(k==='custom')+'"><img class="th" alt="" src="'+S.bgImg+'">올린 사진</button>':'');
  return '<div class="top"><button class="back" data-a="home">‹ 홈</button><h2 style="margin:0">배경 선택</h2></div>'
  +'<div class="card"><h2>색상</h2><div class="swg">'+col+'</div></div>'
  +'<div class="card"><h2>사진</h2>'
  +'<div class="row" style="align-items:center"><label class="pri" style="display:inline-block;cursor:pointer;margin:0">📁 파일 올리기<input type="file" id="bgfile" accept="image/*" hidden></label>'
  +(S.bgImg?'<button class="edb" style="margin:0" data-a="bgdel">올린 사진 지우기</button>':'')+'</div>'
  +'<p class="sub" style="margin:8px 0 12px">폰이나 컴퓨터에 있는 사진 파일을 올려서 배경으로 쓸 수 있어요.</p>'
  +'<div class="swg">'+ph+'</div>'

function handleBgFile(f){

      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.bgImg=c.toDataURL('image/jpeg',.8);S.bg='custom';bgMsg='';
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){bgMsg='이 기기에는 저장하지 못해서 지금만 적용돼요.'}
      applyBg();render();

    im.onerror=()=>{bgMsg='사진을 불러오지 못했어요.';render()};
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

async function cloudFlushDel(){

  for(const cid of q){
    try{await sbDelete(cid);S.delq=(S.delq||[]).filter(x=>x!==cid);save()}catch(e){setCloud('err');return}
  }
}
function cloudAdd(p){
  sbInsert(p).then(row=>{
    if(!row||row.id==null)throw new Error('no id');
    if(!S.prayers.includes(p)){(S.delq=S.delq||[]).push(row.id);save();return cloudFlushDel()}
    p.cid=row.id;save();setCloud('ok');
  }).catch(()=>setCloud('err'));
}
function cloudUpd(p){
  if(p.cid==null)return;

async function sbSync(){
  if(syncing)return;syncing=true;setCloud('ing');
  try{
    await sbAuth();
    await cloudFlushDel();
    for(const p of S.prayers.filter(x=>x.cid==null)){
      const row=await sbInsert(p);if(row&&row.id!=null)p.cid=row.id;
    }
    for(const p of S.prayers.filter(x=>x.cid!=null&&x.dirty)){await sbUpdate(p);p.dirty=false}
    save();
    const rows=await sbList(),skip=new Set((S.delq||[]).map(String)),have=new Map(S.prayers.filter(x=>x.cid!=null).map(x=>[String(x.cid),x])),ids=new Set(S.prayers.map(x=>x.id));
    for(const r of rows){
      const k=String(r.id);if(skip.has(k))continue;
      const p=have.get(k);
      if(p){if(!p.dirty){p.text=r.content;if(r.kind)p.cat=r.kind}}
      else{
        const at=Date.parse(r.created_at)||Date.now();let id=at;while(ids.has(id))id++;ids.add(id);
        S.prayers.push({id,at,cid:r.id,cat:r.kind||CATS[2],text:r.content||'',count:0,last:''});
      }
    }

    save();setCloud('ok');refresh();
  }catch(e){setCloud('err')}
  syncing=false;
}

{q:'야곱에게 하나님이 새로 주신 이름은?',o:['이스라엘','에서','유다','요셉'],a:0,e:'얍복강 가에서 하나님과 씨름한 뒤 이스라엘이라는 이름을 받았어요.'},
{q:'요셉이 꿈 해석으로 총리가 된 나라는?',o:['바벨론','앗수르','애굽','블레셋'],a:2,e:'바로 왕의 꿈을 풀어 주어 애굽의 총리가 되었어요.'},
{q:'엘리야가 바알 선지자들과 대결한 산은?',o:['시내산','갈멜산','시온산','모리아산'],a:1,e:'하늘에서 불이 내려와 하나님이 참 신이심을 보여 주셨어요. (열왕기상 18장)'},
{q:'다윗이 쓴 시가 가장 많은 성경의 책은?',o:['잠언','전도서','시편','아가'],a:2,e:'시편 150편 가운데 많은 시가 다윗의 이름으로 되어 있어요.'},
{q:'예수님이 잡히시기 전날 밤 제자들과 함께하신 식사는?',o:['오병이어의 식사','최후의 만찬','가나의 잔치','엠마오의 저녁'],a:1,e:'예수님은 이 자리에서 떡과 잔을 나누며 성찬의 의미를 가르쳐 주셨어요.'},
{q:'제자가 되기 전 베드로의 직업은?',o:['세리','목수','어부','천막 만드는 사람'],a:2,e:'예수님은 갈릴리 바다에서 그물을 던지던 베드로를 부르셨어요.'},
{q:'예수님이 무덤에서 불러내어 살리신 사람은?',o:['야이로의 딸','나사로','디도','도르가'],a:1,e:'죽은 지 나흘이 된 나사로를 살리셨어요. (요한복음 11장)'},
{q:'“여호와는 나의 목자시니 내가 부족함이 없으리로다”로 시작하는 시편은?',o:['1편','23편','100편','119편'],a:1,e:'다윗이 지은 시로, 하나님의 돌보심을 목자에 비유했어요.'}
];
let deck=[];
function nextQ(){if(!deck.length)deck=QZ.map((_,i)=>i).sort(()=>Math.random()-.5);return QZ[deck.pop()]}
let qv={ok:0,n:0,sel:-1,opts:[],q:null};
function pickQ(){const q=nextQ();qv.q=q;qv.opts=q.o.map((t,i)=>({t,c:i===q.a})).sort(()=>Math.random()-.5);qv.sel=-1}
function quizView(){
  const q=qv.q,done=qv.sel>=0;
  return '<div class="top"><button class="back" data-a="home">‹ 홈</button><h2 style="margin:0">성경 퀴즈</h2></div>'
  +'<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">누적 '+(S.qpts||0)+'점</span><span class="tag">이번 정답 '+qv.ok+'/'+qv.n+'</span></div>'
  +'<div class="verse" style="font-size:20px">'+esc(q.q)+'</div>'
  +qv.opts.map((o,i)=>'<button class="opt'+(done?(o.c?' ok':i===qv.sel?' no':''):'')+'" data-a="qz" data-i="'+i+'"'+(done?' disabled':'')+'>'+esc(o.t)+'</button>').join('')
  +(done?'<p><b>'+(qv.opts[qv.sel].c?'정답이에요! +10점':'아쉬워요. 정답: '+esc(q.o[q.a]))+'</b><br>'+esc(q.e)+'</p><div class="row"><button class="pri" data-a="qnext">다음 문제</button></div>':'')
  +'</div>';
}



function render(){
  document.body.style.setProperty('--calimg','url('+CAL+')');
  document.getElementById('app').innerHTML=view==='home'?home():view==='write'?write():view==='quiz'?quizView():view==='bg'?bgView():pray();
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const ta=document.getElementById('t');if(ta)draft=ta.value;
  const a=t.dataset.a;
  if(a==='cprev'||a==='cnext'||a==='ctoday'){
    if(a==='cprev')calOff--;else if(a==='cnext'&&calOff<0)calOff++;else if(a==='ctoday')calOff=0;
    const y0=window.scrollY;render();window.scrollTo(0,y0);return;
  }
  if(a!=='del')askDel=null;
  if(a==='home'){view='home';newToday=false;err='';askDel=null;editId=null}
  else if(a==='edit'){const q=S.prayers.find(x=>x.id===Number(t.dataset.id));if(q){editId=q.id;cat=q.cat;draft=q.text;err=''}}
  else if(a==='cancel'){editId=null;draft='';err=''}
  else if(a==='write'){view='write';err=''}
  else if(a==='pray'){view='pray';pick()}
  else if(a==='bg'){view='bg';bgMsg=''}
  else if(a==='bgset'){S.bg=t.dataset.v;save();applyBg();const y0=window.scrollY;render();window.scrollTo(0,y0);return}
  else if(a==='bgfit'){S.bgFit=t.dataset.v;save();applyBg();const y0=window.scrollY;render();window.scrollTo(0,y0);return}
  else if(a==='bgdel'){S.bgImg='';if(S.bg==='custom')S.bg='default';save();applyBg();bgMsg='';const y0=window.scrollY;render();window.scrollTo(0,y0);return}
  else if(a==='openp'){view='pray';cur=Number(t.dataset.id);doneNow=false;askDel=null}
  else if(a==='quiz'){view='quiz';qv={ok:0,n:0,sel:-1,opts:[],q:null};pickQ()}
  else if(a==='qz'){
    if(qv.sel<0){qv.sel=Number(t.dataset.i);qv.n++;if(qv.opts[qv.sel].c){qv.ok++;S.qpts=(S.qpts||0)+10;save()}}
    const y0=window.scrollY;render();window.scrollTo(0,y0);return;
  }
  else if(a==='qnext'){pickQ()}
  else if(a==='again'){pick()}
  else if(a==='cat'){cat=t.dataset.c;render();return}
  else if(a==='save'){
    const v=draft.trim();
    if(!v){err='기도문을 먼저 적어 주세요.';render();return}
    if(editId){const q=S.prayers.find(x=>x.id===editId);if(q){q.text=v;q.cat=cat;q.edited=Date.now();q.dirty=true;cloudUpd(q)}editId=null}
    else{const np={id:Date.now(),at:Date.now(),cat:cat,text:v,count:0,last:''};S.prayers.unshift(np);cloudAdd(np)}
    draft='';err='';save();
  }
  else if(a==='del'){
    const id=Number(t.dataset.id);
    if(askDel===id){const gone=S.prayers.find(p=>p.id===id);S.prayers=S.prayers.filter(p=>p.id!==id);askDel=null;if(editId===id){editId=null;draft=''}if(gone&&gone.cid!=null)(S.delq=S.delq||[]).push(gone.cid);save();cloudFlushDel()}else askDel=id;
  }
  else if(a==='done'){
    const p=S.prayers.find(x=>x.id===cur);
    if(p){p.count=(p.count||0)+1;p.last=today;S.prayed[today]=(S.prayed[today]||0)+1;gotAtt=!S.att.includes(today);if(gotAtt)S.att.push(today);S.best=Math.max(S.best||0,streak());save();doneNow=true}
  }
  render();
});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('.calbg')){sx=e.touches[0].clientX;sy=e.touches[0].clientY}else sx=0},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sx||view!=='home')return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
    if(dx>0)calOff--;else if(calOff<0)calOff++;
    const y0=window.scrollY;render();window.scrollTo(0,y0);
  }
  sx=0;
},{passive:true});
applyBg();render();sbSync();
</script>
</body>
</html>
